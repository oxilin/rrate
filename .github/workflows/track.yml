name: Track seats

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours (UTC); GitHub may start it a few minutes late
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Snapshot sections
        run: python3 tracker/tracker.py
      - name: Build fill.json
        run: python3 tracker/report.py
      - name: Commit data
        run: |
          git config user.name "seat-tracker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Seat snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
